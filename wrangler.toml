name = "trendshift-daily-wall"
main = "src/worker/index.ts"
compatibility_date = "2026-11-09"

[assets]
directory = "./dist"
binding = "ASSETS"

# ADMIN_TOKEN 通过 `wrangler secret put ADMIN_TOKEN` 注入；本地开发写入 .dev.vars

[[d1_databases]]
binding = "DB"
database_name = "trendshift-daily-wall"
# 部署前用 `wrangler d1 create trendshift-daily-wall` 得到的真实 ID 替换
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
