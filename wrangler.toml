name = "trendshift-daily-wall"
main = "src/worker/index.ts"
compatibility_date = "2026-11-09"

[assets]
directory = "./dist"
binding = "ASSETS"

# 敏感信息不要写进本文件：
#   生产用 `wrangler secret put ADMIN_TOKEN` 等命令注入
#   本地开发写 .dev.vars（已在 .gitignore 中）

[[d1_databases]]
binding = "DB"
database_name = "trendshift-daily-wall"
# 部署前用 `wrangler d1 create trendshift-daily-wall` 得到的真实 ID 替换
database_id = "5ef017f7-f4b0-4d1c-8996-f6319432fb15"
migrations_dir = "migrations"

# 定时任务放在顶层，确保默认环境（npm run deploy）也生效。
# D1 绑定不会被子环境继承，因此不单独维护 env.production。
[triggers]
crons = ["10 0 * * *", "*/1 * * * *"]
